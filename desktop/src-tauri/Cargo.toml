[package]
name = "theodic_aios_desktop"
version = "0.1.0"
description = "Theodic SME AIOS Tauri 2 cross-platform desktop harness with zero local LLM API keys"
authors = ["Theodic AIOS Maintainers"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "theodic_aios_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
