name: Demo verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: local-ci
          POSTGRES_DB: aios_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios -d aios_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python -m pip install -r requirements-test.txt
      - name: OCR, routing, ledger and API tests with SQLite
        run: python -m unittest discover -s tests -v
      - name: Exercise PostgreSQL SKIP LOCKED and outbox recovery
        env:
          AIOS_TEST_POSTGRES_DSN: postgresql://aios:local-ci@localhost:5432/aios_ci
        run: python -m unittest discover -s tests -p test_demo.py -v
      - name: Exercise the platform action gateway and worker on PostgreSQL
        env:
          AIOS_PLATFORM_TEST_DSN: postgresql://aios:local-ci@localhost:5432/aios_ci
        run: python -m unittest discover -s tests -p test_platform.py -v
      - name: Run the two backend reference workflows without external credentials
        run: python scripts/platform_smoke.py
      - name: Capture the live browser journey
        run: |
          export CHROMIUM_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROMIUM_BIN" ]; then
            python -m playwright install --with-deps chromium
          fi
          export AIOS_STATE_DIR="$(mktemp -d)"
          python -m uvicorn aios_demo.api:app --host 127.0.0.1 --port 8758 > /tmp/aios-server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"; cat /tmp/aios-server.log' EXIT
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:8758/ > /dev/null
          AIOS_CAPTURE_DIR="$RUNNER_TEMP/aios-browser" python scripts/capture_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: pitch-browser-screenshots
          path: ${{ runner.temp }}/aios-browser/*.png
          if-no-files-found: error
