name: DeepSeek workbench smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-workbench:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: deepseek-smoke
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned platform
        run: python -m pip install -r requirements-platform.txt
      - name: Verify sandbox turn and scoped rejection
        env:
          AIOS_LLM_API_KEY: ${{ secrets.AIOS_LLM_API_KEY }}
          AIOS_LLM_BASE_URL: https://api.deepseek.com
          AIOS_LLM_MODEL: deepseek-flash
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          import sys
          import tempfile
          from unittest.mock import patch
          from urllib.parse import urlsplit

          import httpx
          from fastapi.testclient import TestClient

          from aios_platform.api import create_app
          from aios_platform.contracts import Clarify
          from aios_platform.workbench_tools import local_turn

          if not os.environ.get("AIOS_LLM_API_KEY"):
              sys.exit("Smoke blocked: environment secret is missing.")

          expected_host = urlsplit(os.environ.get("AIOS_LLM_BASE_URL", "https://api.deepseek.com")).hostname
          prompt = "Please look up shipment SHP-1001, which is in warehouse HK01, and tell me when it arrives."
          observed = []
          original_sync_send = httpx.Client.send
          original_async_send = httpx.AsyncClient.send

          def record_provider_response(status_code: int, raw_bytes: bytes | None) -> None:
              finish = "unknown"
              if 200 <= status_code < 300 and raw_bytes:
                  try:
                      payload = json.loads(raw_bytes)
                      value = (payload.get("choices") or [{}])[0].get("finish_reason")
                      if value in {"stop", "length", "content_filter", "tool_calls"}:
                          finish = value
                  except (ValueError, KeyError, IndexError, TypeError):
                      pass
              observed.append((status_code, finish))

          def observe_sync(client, request, *args, **kwargs):
              response = original_sync_send(client, request, *args, **kwargs)
              if request.url.host == expected_host:
                  raw_bytes = response.read() if response.is_success else None
                  record_provider_response(response.status_code, raw_bytes)
              return response

          async def observe_async(client, request, *args, **kwargs):
              response = await original_async_send(client, request, *args, **kwargs)
              if request.url.host == expected_host:
                  raw_bytes = await response.aread() if response.is_success else None
                  record_provider_response(response.status_code, raw_bytes)
              return response

          def run():
              if not isinstance(local_turn(prompt), Clarify):
                  return "Unexpected local parser match"
              with tempfile.TemporaryDirectory() as state:
                  token = secrets.token_urlsafe(32)
                  os.environ.update(
                      AIOS_PROFILE="demo",
                      AIOS_PLANNER="demo",
                      AIOS_WORKBENCH_PLANNER="llm",
                      AIOS_LLM_MODEL=os.environ.get("AIOS_LLM_MODEL") or "deepseek-flash",
                      AIOS_PLATFORM_STATE_DIR=state,
                      AIOS_DEMO_SECRET=token,
                  )
                  auth = {"Authorization": "Bearer " + token + ".operator"}
                  with (
                      patch.object(httpx.Client, "send", observe_sync),
                      patch.object(httpx.AsyncClient, "send", observe_async),
                  ):
                      with TestClient(create_app(), raise_server_exceptions=False) as client:
                          result = client.post("/v1/workbench/turns", headers=auth, json={"text": prompt})
                          if result.status_code != 200:
                              return f"Authorized workbench request returned HTTP {result.status_code}"
                          body = result.json()
                          if (
                              set(body) != {"kind", "tool", "source", "data"}
                              or body["kind"] != "result"
                              or body["tool"] != "shipment.read"
                              or body["source"] != "synthetic"
                              or body["data"].get("shipment_id") != "SHP-1001"
                              or set(body["data"]) != {"shipment_id", "warehouse", "delivery_date", "version", "status"}
                          ):
                              return "Unexpected workbench result contract"
                          if len(observed) != 1 or observed[0][0] != 200:
                              return "The real provider call could not be confirmed"
                          denied = client.post(
                              "/v1/workbench/turns", headers=auth,
                              json={"text": "Show invoice INV-100 in HK01"},
                          )
                          if (
                              denied.status_code != 403 or
                              denied.json() != {"detail": {"code": "ACCESS_RESTRICTED"}} or
                              len(observed) != 1
                          ):
                              return "Scoped rejection did not match the contract"
              return None

          try:
              failure = run()
          except Exception as exc:
              sys.exit(f"Smoke failed before a safe result could be verified ({type(exc).__name__}).")
          for http_status, finish in observed:
              print(f"Provider HTTP {http_status}; finish={finish}")
          if failure:
              sys.exit(failure)
          print("Passed: real provider turn, allowlisted result fields, scoped rejection.")
          PY
